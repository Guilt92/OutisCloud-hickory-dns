route:
  receiver: 'default'
  group_by: ['alertname', 'zone']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: 'default'
    webhook_configs:
      - url: 'http://control-api:8080/api/v1/audit/logs'
        send_resolved: true

inhibit_rules:
  - source_matchers: ['severity = critical']
    target_matchers: ['severity = warning']
    equal: ['alertname', 'zone']
