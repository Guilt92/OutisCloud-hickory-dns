global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/outis-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'hickory-dns'
    metrics_path: /metrics
    static_configs:
      - targets: ['dns-server:9000']

  - job_name: 'control-api'
    metrics_path: /metrics
    static_configs:
      - targets: ['control-api:8080']
