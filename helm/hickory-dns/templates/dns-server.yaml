{{- if .Values.dnsServer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hickory-dns.fullname" . }}-dns-server
  namespace: {{ .Values.namespace }}
  labels:
    app: dns-server
    {{- include "hickory-dns.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.dnsServer.replicaCount }}
  selector:
    matchLabels:
      app: dns-server
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
  template:
    metadata:
      labels:
        app: dns-server
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
    spec:
      serviceAccountName: {{ include "hickory-dns.fullname" . }}
      securityContext:
        fsGroup: 10000
      initContainers:
        - name: seed-dns-config
          image: busybox:1.36
          command: ["sh", "-c", "test -f /etc/hickory/named.toml || cp /defaults/named.toml /etc/hickory/named.toml"]
          volumeMounts:
            - name: zone-state
              mountPath: /etc/hickory
            - name: dns-defaults
              mountPath: /defaults
              readOnly: true
      containers:
        - name: dns-server
          image: "{{ .Values.dnsServer.image.registry }}/{{ .Values.dnsServer.image.repository }}:{{ .Values.dnsServer.image.tag }}"
          imagePullPolicy: {{ .Values.dnsServer.image.pullPolicy }}
          env:
            - name: PROMETHEUS_LISTEN_ADDR
              value: "0.0.0.0:{{ .Values.dnsServer.metricsPort }}"
          ports:
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: metrics
              containerPort: {{ .Values.dnsServer.metricsPort }}
              protocol: TCP
          volumeMounts:
            - name: zone-state
              mountPath: /etc/hickory
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add: ["NET_BIND_SERVICE"]
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            periodSeconds: 10
          resources:
            {{- toYaml .Values.dnsServer.resources | nindent 12 }}
      volumes:
        - name: zone-state
          persistentVolumeClaim:
            claimName: {{ required "zoneStorage.existingClaim must name a pre-provisioned ReadWriteMany claim" .Values.zoneStorage.existingClaim }}
        - name: dns-defaults
          configMap:
            name: {{ include "hickory-dns.fullname" . }}-dns-defaults
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hickory-dns.fullname" . }}-dns-server
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.dnsServer.service.type }}
  selector:
    app: dns-server
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hickory-dns.fullname" . }}-dns-metrics
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: dns-server
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  ports:
    - name: metrics
      port: {{ .Values.dnsServer.metricsPort }}
      targetPort: metrics
{{- end }}
