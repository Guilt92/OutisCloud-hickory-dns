{{- if .Values.ui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hickory-dns.fullname" . }}-ui
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.ui.replicaCount }}
  selector:
    matchLabels:
      app: ui
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
  template:
    metadata:
      labels:
        app: ui
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
    spec:
      containers:
        - name: ui
          image: "{{ .Values.ui.image.registry }}/{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "hickory-dns.fullname" . }}-ui-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hickory-dns.fullname" . }}-ui
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.ui.service.type }}
  selector:
    app: ui
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  ports:
    - name: http
      port: {{ .Values.ui.service.port }}
      targetPort: http
{{- if .Values.ui.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "hickory-dns.fullname" . }}-ui
  namespace: {{ .Values.namespace }}
  annotations:
    {{- toYaml .Values.ui.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ui.ingress.className }}
  rules:
    {{- range .Values.ui.ingress.hosts }}
    - host: {{ .host }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "hickory-dns.fullname" $ }}-ui
                port:
                  name: http
          {{- end }}
    {{- end }}
  tls:
    {{- toYaml .Values.ui.ingress.tls | nindent 4 }}
{{- end }}
{{- end }}
