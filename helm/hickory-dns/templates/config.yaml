apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hickory-dns.fullname" . }}-config
  namespace: {{ .Values.namespace }}
data:
  HICKORY_DNS_DIR: /etc/hickory
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hickory-dns.fullname" . }}-dns-defaults
  namespace: {{ .Values.namespace }}
data:
  named.toml: |
{{ .Values.dnsConfig.namedToml | indent 4 }}
{{- if .Values.ui.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hickory-dns.fullname" . }}-ui-nginx
  namespace: {{ .Values.namespace }}
data:
  nginx.conf: |
{{ .Files.Get "files/nginx.conf" | replace "http://control-api:8080" (printf "http://%s-control-api:80" (include "hickory-dns.fullname" .)) | indent 4 }}
{{- end }}
