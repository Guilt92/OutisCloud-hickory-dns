apiVersion: v1
kind: Secret
metadata:
  name: hickory-secrets
  namespace: hickory
  labels:
    app: hickory-dns
type: Opaque
stringData:
  jwt-secret: replace-with-at-least-32-random-bytes
  database-url: postgres://postgres:replace-before-use@postgres:5432/outiscloud
  admin-username: admin
  admin-password: replace-before-use
  agent-ca-cert: replace-with-ca-certificate-pem-if-agent-mtls-is-enabled
  agent-server-cert: replace-with-server-certificate-pem-if-agent-mtls-is-enabled
  agent-server-key: replace-with-server-private-key-pem-if-agent-mtls-is-enabled
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hickory-config
  namespace: hickory
  labels:
    app: hickory-dns
data:
  RUST_LOG: info
  GEOIP_DB_PATH: /var/lib/GeoIP/GeoLite2-Country.mmdb
  SERVER_PORT: "8080"
  ENABLE_METRICS: "true"
  ENABLE_TRACING: "false"
