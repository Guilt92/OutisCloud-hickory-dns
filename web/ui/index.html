<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="OutisCloud - Enterprise DNS Management Platform" />
    <meta name="theme-color" content="#f5f5f5" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <title>OutisCloud DNS Control Panel</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // apply the saved theme before first paint (light paper is the default)
      (function () {
        try {
          var t = localStorage.getItem('outis-theme');
          if (t === 'dark') document.documentElement.classList.add('dark');
        } catch (e) { /* the default light theme is already correct */ }
      })();
    </script>
  </head>
  <body class="h-full antialiased">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
