[package]
name = "control_api"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
actix-web = { version = "4", default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
env_logger = "0.10"
log = "0.4"
prometheus = "0.14"
actix-web-prom = "0.10"
once_cell = { workspace = true }
uuid = { version = "1", features = ["v4", "serde"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-chrono-0_4"] }
serde_qs = "0.7"
jsonwebtoken = "9"
argon2 = "0.5"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
data-encoding = "2"
tracing = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
rand = { workspace = true }
rand_core = { version = "0.6", features = ["getrandom"] }
anyhow = "1"
actix-cors = "0.7"
reqwest = { workspace = true, features = ["rustls", "webpki-roots", "json"] }

# OpenAPI / Swagger
utoipa = "2"
utoipa-actix-web = "0.1"

# Rate limiting
governor = "0.6"
nonzero_ext = "0.3"
regex = { version = "1", default-features = false }

# Async traits
async-trait = "0.1"

# Time
time = "0.3"
toml = { workspace = true }

# Local workspace crates (integrate DNS core)
hickory-proto = { version = "0.26.0-alpha.1", path = "../proto", default-features = false, features = ["std", "dnssec-ring"] }
rustls-pki-types = "1"
hickory-server = { version = "0.26.0-alpha.1", path = "../server", default-features = false }
hickory-resolver = { version = "0.26.0-alpha.1", path = "../resolver", optional = true }
geodns = { version = "0.1.0", path = "../geodns" }

[dev-dependencies]
actix-http = "3"
futures-util = "0.3"
tempfile = "3"
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
