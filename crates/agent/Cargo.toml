[package]
name = "control_agent"
version = "0.1.0"
edition = "2021"

[dependencies]
# rustls only: no system OpenSSL headers are needed to build the agent
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "agent"
path = "src/main.rs"
