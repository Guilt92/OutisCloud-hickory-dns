name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  TEST_DATABASE_URL: postgres://postgres:password@127.0.0.1:5432/hickory

jobs:
  control-api:
    name: control-api (tests, lint, contracts)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: hickory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy -p control_api --all-targets
      - name: Integration tests
        run: cargo test -p control_api --bin control_api -- --test-threads=1
      - name: UI install, lint and build
        working-directory: web/ui
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          npm run lint
          npm run build
      - name: Frontend route contract
        run: node web/ui/tests/route-contract.cjs
      - name: Docs consistency
        run: python3 scripts/docs_check.py

  dns:
    name: DNS server and protocol tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install independent DNS client
        run: sudo apt-get update && sudo apt-get install -y bind9-dnsutils
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: DNS binary tests
        run: cargo test -p hickory-dns --lib
      - name: Health/readiness integration
        run: |
          cargo test -p hickory-dns --test integration test_health_and_ready_endpoints
          cargo test -p hickory-dns --test integration readiness_tracks_failed_zone_reload_and_recovery
          cargo test -p hickory-dns --test integration single_zone_reload_reuses_unchanged_catalog_during_query_load
      - name: Signed AXFR interoperability
        run: |
          cargo test -p hickory-dns --test integration signed_axfr_stream_verifies_with_independent_dig_client
          cargo test -p hickory-dns --test integration signed_axfr_is_supported_for_file_backed_zones
          cargo test -p hickory-dns --test integration hickory_axfr_client_consumes_multipart_transfer
      - name: IXFR safe fallback interoperability
        run: cargo test -p hickory-dns --test integration ixfr_current_serial_succeeds_and_stale_serial_is_refused_safely
      - name: NOTIFY acknowledgement behavior
        run: |
          cargo test -p hickory-dns --test integration notify_acknowledges_local_zone_and_rejects_unknown_zone
          cargo test -p hickory-dns --test integration primary_notifies_configured_secondary_after_zone_reload
      - name: TCP connection admission under fanout
        run: cargo test -p hickory-dns --test integration protocol_admission_fanout_keeps_service_available
      - name: DoH3 client and binary listener interoperability
        run: cargo test -p hickory-dns --test integration --features 'h3-ring https-ring' doh3_client_queries_local_authoritative_server
      - name: Server tests
        run: cargo test -p hickory-server --features sqlite --lib
      - name: GeoDNS tests
        run: cargo test -p geodns --lib

  security:
    name: Dependency and license policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: cargo audit
        run: cargo audit
      - name: cargo deny
        run: cargo deny check

  images:
    name: Build container images
    runs-on: ubuntu-latest
    needs: [control-api, dns]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Control API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: crates/control_api/Dockerfile
          push: false
          tags: outiscloud-control-api:ci
      - name: DNS server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: bin/Dockerfile
          push: false
          tags: outiscloud-dns-server:ci
      - name: UI image
        uses: docker/build-push-action@v5
        with:
          context: ./web/ui
          file: ./web/ui/Dockerfile
          push: false
          tags: outiscloud-ui:ci
